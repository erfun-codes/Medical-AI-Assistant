<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CureLink Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(135deg, #f4f7fa 0%, #e2e9f3 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-container { background: #ffffff; width: 100%; max-width: 500px; padding: 2.5rem; border-radius: 24px; box-shadow: 0 15px 35px rgba(0, 119, 182, 0.08); border: 1px solid rgba(0,0,0,0.03); position: relative; }
        .back-home { position: absolute; top: 25px; left: 25px; text-decoration: none; color: #5c677d; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .back-home:hover { color: #0077b6; }
        .auth-header { text-align: center; margin-top: 1.5rem; margin-bottom: 2rem; }
        .auth-header .logo { font-size: 1.6rem; font-weight: 800; color: #0077b6; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 0.5rem; }
        .auth-header .logo i { color: #06d6a0; }
        .auth-header h2 { font-size: 1.5rem; font-weight: 800; color: #0b132b; }
        .auth-header p { color: #5c677d; font-size: 0.9rem; margin-top: 4px; }
        .form-group { margin-bottom: 1.2rem; display: flex; flex-direction: column; gap: 6px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group label { font-size: 0.88rem; font-weight: 700; color: #0b132b; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i.input-icon { position: absolute; left: 15px; color: #0077b6; font-size: 1rem; }
        .input-wrapper input { width: 100%; padding: 0.85rem 1rem 0.85rem 2.8rem; border-radius: 12px; border: 1px solid rgba(0,0,0,0.08); background: #f8fafc; font-size: 0.95rem; outline: none; transition: all 0.2s ease; }
        .input-wrapper input:focus { border-color: #0077b6; background: #ffffff; box-shadow: 0 0 0 4px rgba(0, 119, 182, 0.06); }
        .terms { display: flex; align-items: center; gap: 6px; color: #5c677d; font-size: 0.85rem; font-weight: 500; margin-bottom: 1.5rem; cursor: pointer; }
        .submit-btn { width: 100%; padding: 0.9rem; border: none; border-radius: 12px; background: linear-gradient(135deg, #06d6a0, #04a57a); color: white; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(6, 214, 160, 0.2); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 214, 160, 0.3); }
        .auth-footer { text-align: center; margin-top: 2rem; font-size: 0.9rem; color: #5c677d; font-weight: 500; }
        .auth-footer a { color: #0077b6; text-decoration: none; font-weight: 700; }
        .auth-footer a:hover { text-decoration: underline; }
        .error-message { color: #ef4444; font-size: 0.85rem; font-weight: 600; display: none; margin-top: 2px; }
        
        @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; gap: 0; } }
    </style>
</head>
<body>

    <div class="auth-container">
        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Home</a>
        
        <div class="auth-header">
            <div class="logo"><i class="fa-solid fa-notes-medical"></i> CureLink</div>
            <h2>Create Account</h2>
            <p>Join our premium verified medical network</p>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" placeholder="John Doe" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" placeholder="john@mail.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone input-icon"></i>
                        <input type="tel" placeholder="+91 XXXXX" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Create Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-halved input-icon"></i>
                        <input type="password" id="confirmPassword" placeholder="••••••••" required>
                    </div>
                </div>
            </div>
            <div class="error-message" id="errorMsg">❌ Passwords do not match!</div>

            <label class="terms">
                <input type="checkbox" required> I agree to the Terms of Service & Privacy Policy
            </label>

            <button type="submit" class="submit-btn">Register Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('signupForm');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Validation Engine
            if (password.value !== confirmPassword.value) {
                errorMsg.style.display = 'block';
                confirmPassword.style.borderColor = '#ef4444';
            } else {
                errorMsg.style.display = 'none';
                window.location.href = 'login.html'; // Successfully registered hole login page-e niye jabe
            }
        });
    </script>
</body>
</html>
