<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CureLink Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(135deg, #f4f7fa 0%, #e2e9f3 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-container { background: #ffffff; width: 100%; max-width: 450px; padding: 2.5rem; border-radius: 24px; box-shadow: 0 15px 35px rgba(0, 119, 182, 0.08); border: 1px solid rgba(0,0,0,0.03); position: relative; }
        .back-home { position: absolute; top: 25px; left: 25px; text-decoration: none; color: #5c677d; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .back-home:hover { color: #0077b6; }
        .auth-header { text-align: center; margin-top: 1.5rem; margin-bottom: 2rem; }
        .auth-header .logo { font-size: 1.6rem; font-weight: 800; color: #0077b6; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 0.5rem; }
        .auth-header .logo i { color: #06d6a0; }
        .auth-header h2 { font-size: 1.5rem; font-weight: 800; color: #0b132b; }
        .auth-header p { color: #5c677d; font-size: 0.9rem; margin-top: 4px; }
        .form-group { margin-bottom: 1.2rem; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.88rem; font-weight: 700; color: #0b132b; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i.input-icon { position: absolute; left: 15px; color: #0077b6; font-size: 1rem; }
        .input-wrapper input { width: 100%; padding: 0.85rem 2.8rem 0.85rem 2.8rem; border-radius: 12px; border: 1px solid rgba(0,0,0,0.08); background: #f8fafc; font-size: 0.95rem; outline: none; transition: all 0.2s ease; }
        .input-wrapper input:focus { border-color: #0077b6; background: #ffffff; box-shadow: 0 0 0 4px rgba(0, 119, 182, 0.06); }
        .toggle-password { position: absolute; right: 15px; color: #5c677d; cursor: pointer; font-size: 0.95rem; }
        .toggle-password:hover { color: #0077b6; }
        .form-actions { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin-bottom: 1.5rem; }
        .remember-me { display: flex; align-items: center; gap: 6px; color: #5c677d; font-weight: 500; cursor: pointer; }
        .forgot-pass { color: #0077b6; text-decoration: none; font-weight: 600; }
        .forgot-pass:hover { text-decoration: underline; }
        .submit-btn { width: 100%; padding: 0.9rem; border: none; border-radius: 12px; background: linear-gradient(135deg, #0077b6, #023e8a); color: white; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 119, 182, 0.2); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 119, 182, 0.3); }
        .auth-footer { text-align: center; margin-top: 2rem; font-size: 0.9rem; color: #5c677d; font-weight: 500; }
        .auth-footer a { color: #0077b6; text-decoration: none; font-weight: 700; }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-container">
        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Home</a>
        
        <div class="auth-header">
            <div class="logo"><i class="fa-solid fa-notes-medical"></i> CureLink</div>
            <h2>Welcome Back</h2>
            <p>Login to access your healthcare panel</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" placeholder="example@mail.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-pass">Forgot Password?</a>
            </div>

            <button type="submit" class="submit-btn">Secure Login</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="sigup.html">Sign Up here</a>
        </div>
    </div>

    <script>
        // Password Show/Hide Functionality
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.classList.toggle('fa-eye');
            togglePassword.classList.toggle('fa-eye-slash');
        });

        // Form Submit Redirection
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            window.location.href = 'dashboard.html'; // Direct dashboard-e chole jabe
        });
    </script>
</body>
</html>
